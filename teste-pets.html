<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teste de Pets — Tchukos Beer</title>
</head>
<body style="font-family:Arial;padding:30px;background:#f8f1e7">

  <h1>🐾 Tchukos Beer</h1>
  <h2>Consulta de Pets Aprovados</h2>

  <button id="consultar" style="padding:15px;cursor:pointer">
    Consultar pets aprovados
  </button>

  <pre id="resultado" style="white-space:pre-wrap"></pre>

  <script>
    document.getElementById('consultar').onclick = async () => {
      const resultado = document.getElementById('resultado');
      resultado.textContent = 'Consultando o Wix...';

      try {
        const resposta = await fetch(
          'https://tchukos-pet-api.onrender.com/api/pets/aprovados'
        );

        const dados = await resposta.json();
        resultado.textContent = JSON.stringify(dados, null, 2);

      } catch (erro) {
        resultado.textContent = 'Erro: ' + erro.message;
      }
    };
  </script>

</body>
</html>
